<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Status</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="logo" href="index.html">Canva Account Store</a><a class="btn" href="order.html">Buy Now</a></nav><main class="container"><div class="form"><h1>Check Order Status</h1><form id="search"><div class="field"><label>Order ID</label><input id="oid" required></div><div class="field"><label>Phone</label><input id="ophone" required></div><button class="btn">Check</button></form><div id="result"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function check(){const q=new URLSearchParams(location.search);if(q.get('order')){oid.value=q.get('order');ophone.value=q.get('phone')||'';run()}}async function run(){result.innerHTML='<div class="notice">Checking...</div>';const {data,error}=await sb.rpc('get_order_status',{p_order_number:oid.value.trim(),p_phone:ophone.value.trim()});const row=data?.[0];if(error||!row){result.innerHTML='<div class="notice">Order not found.</div>';return}result.innerHTML=`<div class="card" style="margin-top:20px"><h2>${row.order_number}</h2><p><b>Customer:</b> ${row.customer_name}</p><p><b>Product:</b> ${row.product_name||'—'}</p><p><b>Status:</b> <span class="badge">${row.status}</span></p><p><b>Date:</b> ${new Date(row.created_at).toLocaleString()}</p></div>`}search.addEventListener('submit',e=>{e.preventDefault();run()});check();
</script></body></html>

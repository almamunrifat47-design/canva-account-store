<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canva Account Store</title><link rel="stylesheet" href="styles.css">
<style id="savedPageCss"></style>
</head>
<body>
<div id="pageRoot">
<nav class="nav"><a class="logo" href="index.html">Canva Account Store</a><div class="navlinks"><a href="#products">Products</a><a href="order-status.html">Order Status</a><a class="btn" href="order.html">Buy Now</a></div></nav>
<section class="hero"><h1>Choose Your Canva Account</h1><p>Simple ordering for Canva Pro and Owner accounts.</p></section>
<main class="container" id="products"><div id="productsGrid" class="cards"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const fallbackHtml=document.getElementById('pageRoot').innerHTML;
async function renderProducts(){
  const {data,error}=await sb.from('products').select('*').eq('is_active',true).order('name');
  const grid=document.getElementById('productsGrid');
  if(error||!grid){if(grid)grid.innerHTML='<div class="card">Products unavailable.</div>';return;}
  grid.innerHTML=(data||[]).map(p=>`<article class="card"><h2>${escapeHtml(p.name)}</h2><p>${escapeHtml(p.description||'')}</p><div class="price">৳${Number(p.price).toLocaleString()}</div><ul class="features">${(p.features||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul><a class="btn" href="order.html?product=${encodeURIComponent(p.slug)}">Buy Now</a></article>`).join('');
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function loadSaved(){
 const {data,error}=await sb.from('site_pages').select('html,css').eq('slug','home').maybeSingle();
 if(!error && data && data.html){
   document.getElementById('pageRoot').innerHTML=data.html;
   document.getElementById('savedPageCss').textContent=data.css||'';
 }
 await renderProducts();
}
loadSaved();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canva Account Store</title><link rel="stylesheet" href="styles.css"></head><body>
<nav class="nav"><a class="logo" href="index.html">Canva Account Store</a><div class="navlinks"><a href="#products">Products</a><a href="order-status.html">Order Status</a><a class="btn" href="order.html">Buy Now</a></div></nav>
<section class="hero"><h1>Choose Your Canva Account</h1><p>Simple ordering for Canva Pro and Owner accounts.</p></section>
<main class="container" id="products"><div id="productsGrid" class="cards"></div></main>

<div id="storeSidebar" class="store-sidebar">
  <button id="sidebarToggle" class="sidebar-toggle" aria-label="Open menu">☰</button>
  <div id="sidebarPanel" class="sidebar-panel">
    <div class="sidebar-heading">Quick Menu</div>
    <div id="sidebarItems"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function load(){const {data,error}=await sb.from('products').select('*').eq('is_active',true).order('name');if(error){productsGrid.innerHTML='<div class="card">Configure Supabase first.</div>';return}productsGrid.innerHTML=data.map(p=>`<article class="card"><h2>${p.name}</h2><p>${p.description||''}</p><div class="price">৳${Number(p.price).toLocaleString()}</div><ul class="features">${(p.features||[]).map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn" href="order.html?product=${encodeURIComponent(p.slug)}">Buy Now</a></article>`).join('')}load();
</script>
<script>
async function loadStoreSidebar(){
  const wrap=document.getElementById('sidebarItems');
  const {data,error}=await sb.from('sidebar_items').select('*').eq('is_active',true).order('sort_order').order('created_at');
  if(error || !data){ wrap.innerHTML=''; return; }
  wrap.innerHTML=data.map(item=>{
    const safeTitle=String(item.title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const safeIcon=String(item.icon||'🔗').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<a class="sidebar-item" href="${String(item.url||'#').replace(/"/g,'&quot;')}"><span>${safeIcon}</span><span>${safeTitle}</span></a>`;
  }).join('');
}
document.getElementById('sidebarToggle').addEventListener('click',()=>{
  document.getElementById('sidebarPanel').classList.toggle('open');
});
loadStoreSidebar();
</script>
</body></html>

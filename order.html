<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Place Order</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="logo" href="index.html">Canva Account Store</a><a href="order-status.html">Order Status</a></nav><main class="container"><div class="form"><h1>Place Your Order</h1><div id="msg"></div><form id="form"><div class="field"><label>Full Name *</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone / WhatsApp *</label><input id="phone" required></div><div class="field"><label>Product *</label><select id="product" required></select></div><div class="field"><label>Quantity</label><input id="qty" type="number" min="1" value="1" required></div><div class="field"><label>Payment Method *</label><select id="payment" required><option value="">Select</option><option>bKash</option><option>Nagad</option><option>Bank Transfer</option><option>Other</option></select></div><div class="field"><label>Transaction ID *</label><input id="tx" required></div><div class="field"><label>Additional Note</label><textarea id="note"></textarea></div><button class="btn" type="submit">Submit Order</button></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let products=[];
async function init(){const r=await sb.from('products').select('*').eq('is_active',true);products=r.data||[];product.innerHTML=products.map(p=>`<option value="${p.id}">${p.name} — ৳${p.price}</option>`).join('');const slug=new URLSearchParams(location.search).get('product');const found=products.find(p=>p.slug===slug);if(found)product.value=found.id}init();
form.addEventListener('submit',async e=>{e.preventDefault();msg.innerHTML='<div class="notice">Submitting...</div>';const order_number='CAN-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const {error}=await sb.from('orders').insert({order_number,customer_name:name.value,customer_email:email.value||null,customer_phone:phone.value,product_id:product.value,quantity:Number(qty.value),payment_method:payment.value,transaction_id:tx.value,note:note.value||null});if(error){msg.innerHTML='<div class="notice">Order failed. Please try again.</div>';return}location.href='order-status.html?order='+encodeURIComponent(order_number)+'&phone='+encodeURIComponent(phone.value)});
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Place Order</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav">
  <a class="logo" href="index.html">Canva Account Store</a>
  <a href="order-status.html">Order Status</a>
</nav>

<main class="container">
  <div class="form">
    <h1>Place Your Order</h1>
    <div id="msg"></div>

    <form id="orderForm">
      <div class="field">
        <label for="customerName">Full Name *</label>
        <input id="customerName" required>
      </div>

      <div class="field">
        <label for="customerEmail">Email</label>
        <input id="customerEmail" type="email">
      </div>

      <div class="field">
        <label for="customerPhone">Phone / WhatsApp *</label>
        <input id="customerPhone" required>
      </div>

      <div class="field">
        <label for="productSelect">Product *</label>
        <select id="productSelect" required>
          <option value="">Loading products...</option>
        </select>
      </div>

      <div class="field">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="1" value="1" required>
      </div>

      <div class="field">
        <label for="paymentMethod">Payment Method *</label>
        <select id="paymentMethod" required>
          <option value="">Select</option>
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="transactionId">Transaction ID *</label>
        <input id="transactionId" required>
      </div>

      <div class="field">
        <label for="note">Additional Note</label>
        <textarea id="note"></textarea>
      </div>

      <button class="btn" id="submitBtn" type="submit">Submit Order</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const orderForm = document.getElementById('orderForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  const customerName = document.getElementById('customerName');
  const customerEmail = document.getElementById('customerEmail');
  const customerPhone = document.getElementById('customerPhone');
  const productSelect = document.getElementById('productSelect');
  const quantity = document.getElementById('quantity');
  const paymentMethod = document.getElementById('paymentMethod');
  const transactionId = document.getElementById('transactionId');
  const note = document.getElementById('note');

  let products = [];

  function showMessage(text, type = 'notice') {
    msg.innerHTML = '<div class="' + type + '">' + text + '</div>';
  }

  async function loadProducts() {
    const { data, error } = await sb
      .from('products')
      .select('id,name,slug,price')
      .eq('is_active', true)
      .order('name');

    if (error) {
      console.error('Product loading error:', error);
      productSelect.innerHTML = '<option value="">Unable to load products</option>';
      showMessage('Could not load products. Please refresh the page.');
      return;
    }

    products = data || [];

    productSelect.innerHTML =
      '<option value="">Select a product</option>' +
      products.map(p =>
        '<option value="' + p.id + '">' +
        p.name + ' — ৳' + Number(p.price).toLocaleString() +
        '</option>'
      ).join('');

    const slug = new URLSearchParams(location.search).get('product');
    const selected = products.find(p => p.slug === slug);
    if (selected) productSelect.value = selected.id;
  }

  orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!productSelect.value) {
      showMessage('Please select a product.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    showMessage('Submitting your order...');

    const orderNumber =
      'CAN-' +
      new Date().toISOString().slice(0, 10).replaceAll('-', '') +
      '-' +
      Math.random().toString(36).slice(2, 8).toUpperCase();

    const payload = {
      order_number: orderNumber,
      customer_name: customerName.value.trim(),
      customer_email: customerEmail.value.trim() || null,
      customer_phone: customerPhone.value.trim(),
      product_id: productSelect.value,
      quantity: Number(quantity.value),
      payment_method: paymentMethod.value,
      transaction_id: transactionId.value.trim(),
      note: note.value.trim() || null
    };

    console.log('Submitting order:', payload);

    const { data, error } = await sb
      .from('orders')
      .insert(payload)
      .select('order_number')
      .single();

    if (error) {
      console.error('Order insert error:', error);
      showMessage(
        'Order failed: ' +
        (error.message || 'Unknown database error') +
        '<br><small>Please check the information and try again.</small>'
      );
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Order';
      return;
    }

    const phone = encodeURIComponent(customerPhone.value.trim());
    location.href =
      'order-status.html?order=' +
      encodeURIComponent(data.order_number) +
      '&phone=' + phone;
  });

  loadProducts();
</script>
</body>
</html>

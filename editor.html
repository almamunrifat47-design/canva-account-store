<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Editor</title>
<link rel="stylesheet" href="https://unpkg.com/grapesjs@0.22.10/dist/css/grapes.min.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
.topbar{height:62px;background:#17151f;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;position:fixed;inset:0 0 auto;z-index:9999}
.logo{font-size:19px;font-weight:800;margin-right:auto}
.top-btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}
.preview{background:#fff;color:#111}.save{background:#6c4df6;color:#fff}.upload{background:#168c76;color:#fff}.logout{background:#fff;color:#111}
.workspace{position:fixed;top:62px;left:0;right:0;bottom:0;display:grid;grid-template-columns:235px minmax(0,1fr) 280px}
.left{background:#17151f;color:#fff;border-right:1px solid #302c3a;overflow:auto;padding:12px}
.left h3{margin:5px 0 4px;font-size:16px}.hint{color:#999;font-size:11px;margin-bottom:14px}
.cat{color:#a98cff;font-size:11px;font-weight:800;margin:16px 0 8px;text-transform:uppercase}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.block{background:#24212d;border:1px solid #3a3545;color:#fff;border-radius:8px;min-height:68px;padding:10px 5px;cursor:pointer;text-align:center;font-size:12px;user-select:none}
.block:hover{background:#332e40;border-color:#8065ff}
.block:active{transform:scale(.97)}
.uploadwide{width:100%;margin-top:15px;padding:11px;border:0;border-radius:8px;background:#6c4df6;color:#fff;font-weight:700;cursor:pointer}
.canvas{background:#e7e7ec;min-width:0;overflow:hidden}
#editor{height:100%}
.right{background:#17151f;color:#fff;border-left:1px solid #302c3a;overflow:auto}
.right-title{padding:15px;border-bottom:1px solid #302c3a;font-weight:800}
#traits,#styles{padding:10px}
.gjs-pn-panels{display:none!important}
.gjs-one-bg{background:#17151f}.gjs-two-color{color:#ddd}.gjs-three-bg{background:#24212d}.gjs-four-color{color:#a98cff}
.gjs-sm-sector{border-color:#35313f!important}.gjs-sm-sector-title{background:#211e29!important;color:#fff!important}
.gjs-field{background:#24212d!important;border-color:#403b4d!important;color:#fff!important}
.gjs-field input,.gjs-field select{color:#fff!important}
#msg{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:9px;box-shadow:0 10px 35px #0004;z-index:20000;display:none;font-weight:700}
@media(max-width:850px){.workspace{grid-template-columns:170px minmax(0,1fr)}.right{display:none}.top-btn{padding:8px 10px;font-size:12px}}
@media(max-width:600px){.workspace{grid-template-columns:125px minmax(0,1fr)}.blocks{grid-template-columns:1fr}.logo{font-size:14px}.upload{display:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">🎨 Visual Editor</div>
  <button class="top-btn upload" id="topUpload">📷 Add Photo</button>
  <button class="top-btn preview" id="preview">Preview</button>
  <button class="top-btn save" id="save">💾 Save Changes</button>
  <button class="top-btn logout" id="logout">Logout</button>
</header>

<div class="workspace">

<aside class="left">
  <h3>➕ Add Elements</h3>
  <div class="hint">Click an element to add it. You can also drag it onto the page.</div>

  <div class="cat">Basic</div>
  <div class="blocks">
    <button class="block" data-type="text">📝<br>Text</button>
    <button class="block" data-type="heading">🔤<br>Heading</button>
    <button class="block" data-type="link">🔗<br>Link</button>
    <button class="block" data-type="button">🔘<br>Button</button>
    <button class="block" data-type="image">🖼️<br>Image</button>
    <button class="block" data-type="divider">➖<br>Divider</button>
  </div>

  <div class="cat">Layout</div>
  <div class="blocks">
    <button class="block" data-type="section">📦<br>Section</button>
    <button class="block" data-type="columns">▥<br>2 Columns</button>
    <button class="block" data-type="spacer">↕<br>Spacer</button>
    <button class="block" data-type="card">🃏<br>Card</button>
    <button class="block" data-type="hero">⭐<br>Hero</button>
    <button class="block" data-type="features">✨<br>Features</button>
  </div>

  <div class="cat">Media</div>
  <div class="blocks">
    <button class="block" data-type="video">▶️<br>Video</button>
    <button class="block" data-type="icon">✦<br>Icon</button>
  </div>

  <button class="uploadwide" id="sideUpload">📁 Upload Image</button>
  <input id="file" type="file" accept="image/*" hidden>
</aside>

<main class="canvas"><div id="editor"></div></main>

<aside class="right">
  <div class="right-title">⚙️ Element Settings</div>
  <div id="traits"></div>
  <div class="right-title">🎨 Style</div>
  <div id="styles"></div>
</aside>

</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/grapesjs@0.22.10/dist/grapes.min.js"></script>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let editor = null;

function toast(text){
  const m=document.getElementById('msg');
  m.textContent=text;
  m.style.display='block';
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>m.style.display='none',2200);
}

const DEFAULT_HTML = `
<nav class="site-nav">
  <a class="site-logo" href="index.html">Canva Account Store</a>
  <div class="nav-links">
    <a href="#products">Products</a>
    <a href="order-status.html">Order Status</a>
    <a class="main-button" href="order.html">Buy Now</a>
  </div>
</nav>
<section class="hero-section">
  <h1>Choose Your Canva Account</h1>
  <p>Simple ordering for Canva Pro and Owner accounts.</p>
</section>
<section id="products" class="products-section">
  <div class="product-grid">
    <div class="product-card">
      <h2>Canva Pro Account</h2>
      <p>Premium Canva account.</p>
      <div class="price">৳500</div>
      <ul><li>Premium features</li><li>Easy ordering</li><li>Fast delivery</li></ul>
      <a class="main-button" href="order.html?product=canva-pro">Buy Now</a>
    </div>
    <div class="product-card">
      <h2>Canva Owner Account</h2>
      <p>Canva owner account.</p>
      <div class="price">৳1500</div>
      <ul><li>Owner access</li><li>Easy ordering</li><li>Fast delivery</li></ul>
      <a class="main-button" href="order.html?product=canva-owner">Buy Now</a>
    </div>
  </div>
</section>`;

const DEFAULT_CSS = `
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7fb;color:#17151f}
a{text-decoration:none;color:inherit}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 6%;background:#fff;border-bottom:1px solid #eee}
.site-logo{font-size:21px;font-weight:800}
.nav-links{display:flex;align-items:center;gap:22px}
.main-button{display:inline-flex;align-items:center;justify-content:center;padding:12px 19px;border-radius:10px;background:#6c4df6;color:#fff;font-weight:700}
.hero-section{text-align:center;padding:85px 20px}
.hero-section h1{margin:0 0 15px;font-size:48px;line-height:1.1}
.hero-section p{margin:0;color:#666;font-size:18px}
.products-section{max-width:1100px;margin:auto;padding:40px 20px 80px}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:25px}
.product-card{background:#fff;border:1px solid #e8e8ee;border-radius:18px;padding:30px;box-shadow:0 10px 35px #0000000f}
.price{font-size:32px;font-weight:800;margin:20px 0}
.product-card li{margin:8px 0}
@media(max-width:700px){.site-nav{flex-direction:column;align-items:flex-start}.nav-links{width:100%;flex-wrap:wrap;gap:10px}.hero-section{padding:55px 18px}.hero-section h1{font-size:34px}.product-grid{grid-template-columns:1fr}}`;

const ELEMENTS = {
  text:`<p style="padding:10px;">Write your text here</p>`,
  heading:`<h2 style="padding:10px;">New Heading</h2>`,
  link:`<a href="#" style="display:inline-block;padding:10px;">New Link</a>`,
  button:`<a href="#" class="main-button">New Button</a>`,
  image:`<img src="https://placehold.co/800x450?text=Your+Image" alt="Image" style="max-width:100%;height:auto;display:block;margin:20px auto;">`,
  divider:`<hr style="margin:30px 0;">`,
  section:`<section style="padding:50px 25px;"><h2>New Section</h2><p>Section content goes here.</p></section>`,
  columns:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;"><div style="padding:30px;background:#f5f5f5;">Column One</div><div style="padding:30px;background:#f5f5f5;">Column Two</div></div>`,
  spacer:`<div style="height:100px;"></div>`,
  card:`<div style="background:#fff;padding:30px;border-radius:18px;border:1px solid #eee;margin:15px 0;"><h2>New Card</h2><p>Card description</p><a href="#" class="main-button">Learn More</a></div>`,
  hero:`<section style="padding:80px 25px;text-align:center;background:#f0edff;"><h1>Your Hero Title</h1><p>Your hero description goes here.</p><a href="#" class="main-button">Get Started</a></section>`,
  features:`<section style="padding:40px 20px;"><h2 style="text-align:center;">Our Features</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;"><div class="product-card"><h3>Feature One</h3><p>Description</p></div><div class="product-card"><h3>Feature Two</h3><p>Description</p></div><div class="product-card"><h3>Feature Three</h3><p>Description</p></div></div></section>`,
  video:`<video controls style="width:100%;max-width:800px;"></video>`,
  icon:`<div style="font-size:50px;text-align:center;padding:20px;">⭐</div>`
};

async function init(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){location.href='admin.html';return;}

  const {data:admin,error:ae}=await sb.from('admin_users').select('id').eq('id',user.id).maybeSingle();
  if(ae || !admin){await sb.auth.signOut();location.href='admin.html';return;}

  let html=DEFAULT_HTML, css=DEFAULT_CSS;
  const {data:saved,error:se}=await sb.from('site_pages').select('html,css').eq('slug','home').maybeSingle();
  if(!se && saved && saved.html){html=saved.html;css=saved.css||DEFAULT_CSS;}

  editor=grapesjs.init({
    container:'#editor',
    height:'100%',
    fromElement:false,
    components:html,
    style:css,
    storageManager:false,
    blockManager:{appendTo:'#blocks',blocks:[]},
    traitManager:{appendTo:'#traits'},
    styleManager:{
      appendTo:'#styles',
      sectors:[
        {name:'Dimension',open:true,properties:['width','height','min-height','max-width']},
        {name:'Spacing',open:false,properties:['margin','padding']},
        {name:'Typography',open:false,properties:['font-family','font-size','font-weight','color','text-align','line-height','letter-spacing']},
        {name:'Background',open:false,properties:['background-color','background-image']},
        {name:'Border',open:false,properties:['border','border-radius']}
      ]
    },
    deviceManager:{devices:[
      {name:'Desktop',width:''},
      {name:'Tablet',width:'768px'},
      {name:'Mobile',width:'375px'}
    ]},
    selectorManager:{componentFirst:true},
    panels:{defaults:[]}
  });

  /* IMPORTANT: custom sidebar buttons */
  document.querySelectorAll('.block').forEach(btn=>{
    btn.draggable=true;

    btn.addEventListener('click',e=>{
      e.preventDefault();
      e.stopPropagation();
      addElement(btn.dataset.type);
    });

    btn.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain',btn.dataset.type);
      e.dataTransfer.effectAllowed='copy';
    });
  });

  /* Native drop anywhere in the editor canvas */
  editor.on('canvas:drop',({target})=>{
    /* GrapesJS handles native component drops itself.
       This event is intentionally left enabled. */
  });

  toast('✅ Editor ready');
}

function addElement(type){
  if(!editor){toast('Editor is not ready');return;}
  const html=ELEMENTS[type];
  if(!html)return;

  const selected=editor.getSelected();

  if(selected && !selected.is('wrapper')){
    selected.append(html);
  }else{
    editor.getWrapper().append(html);
  }

  toast('✅ '+type+' added');
}

async function uploadImage(){
  document.getElementById('file').click();
}

document.getElementById('topUpload').onclick=uploadImage;
document.getElementById('sideUpload').onclick=uploadImage;

document.getElementById('file').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('Please select an image.');return;}

  const reader=new FileReader();
  reader.onload=()=>{
    const img=`<img src="${reader.result}" alt="Uploaded Image" style="max-width:100%;height:auto;display:block;margin:20px auto;">`;
    const selected=editor.getSelected();
    if(selected && !selected.is('wrapper')) selected.append(img);
    else editor.getWrapper().append(img);
    toast('📷 Image added');
    e.target.value='';
  };
  reader.readAsDataURL(file);
});

document.getElementById('save').onclick=async()=>{
  if(!editor)return;

  const {error}=await sb.from('site_pages').upsert({
    slug:'home',
    html:editor.getHtml(),
    css:editor.getCss(),
    updated_at:new Date().toISOString()
  },{onConflict:'slug'});

  if(error){
    console.error(error);
    alert(error.message);
    toast('❌ Save failed');
    return;
  }
  toast('✅ Design saved');
};

document.getElementById('preview').onclick=()=>{
  if(!editor)return;
  const w=window.open('','_blank');
  w.document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${editor.getCss()}</style></head><body>${editor.getHtml()}</body></html>`);
  w.document.close();
};

document.getElementById('logout').onclick=async()=>{
  await sb.auth.signOut();
  location.href='admin.html';
};

init();
</script>
</body>
</html>

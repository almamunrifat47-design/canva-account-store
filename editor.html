<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visual Editor</title>

  <!-- GrapesJS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/grapesjs@0.22.10/dist/css/grapes.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 62px;
      width: 100%;
      background: #17151f;
      color: white;

      display: flex;
      align-items: center;

      padding: 0 14px;
      gap: 10px;

      position: fixed;
      top: 0;
      left: 0;

      z-index: 9999;
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      margin-right: auto;
    }

    .top-btn {
      border: none;
      border-radius: 9px;
      padding: 10px 16px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .top-btn:hover {
      opacity: 0.9;
    }

    .preview-btn {
      background: white;
      color: #111;
    }

    .save-btn {
      background: #6c4df6;
      color: white;
    }

    .upload-btn {
      background: #168c76;
      color: white;
    }

    .logout-btn {
      background: white;
      color: #111;
    }


    /* =========================
       MAIN AREA
    ========================= */

    .workspace {
      position: fixed;

      top: 62px;
      left: 0;
      right: 0;
      bottom: 0;

      display: grid;

      grid-template-columns:
        235px
        minmax(0, 1fr)
        280px;
    }


    /* =========================
       LEFT SIDEBAR
    ========================= */

    .left-sidebar {

      background: #17151f;

      border-right: 1px solid #302c3a;

      color: white;

      overflow-y: auto;

      padding: 12px;
    }

    .sidebar-title {

      font-size: 15px;
      font-weight: 800;

      padding: 10px 5px 14px;

      color: white;
    }

    .sidebar-subtitle {

      font-size: 11px;

      color: #999;

      padding: 0 5px 12px;
    }


    /* GrapesJS blocks */

    #blocks {

      width: 100%;
    }

    .gjs-blocks-c {

      display: grid !important;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;

      padding: 0 !important;
    }

    .gjs-block {

      width: auto !important;

      min-height: 72px;

      margin: 0 !important;

      padding: 10px 5px !important;

      background: #24212d !important;

      border: 1px solid #3a3545 !important;

      border-radius: 8px !important;

      color: white !important;

      box-shadow: none !important;
    }

    .gjs-block:hover {

      border-color: #8065ff !important;

      background: #312d3d !important;
    }

    .gjs-block-label {

      font-size: 12px;
    }


    .upload-area {

      margin-top: 18px;

      padding-top: 15px;

      border-top: 1px solid #302c3a;
    }

    .upload-area button {

      width: 100%;

      padding: 11px;

      border: none;

      border-radius: 8px;

      background: #6c4df6;

      color: white;

      font-weight: 700;

      cursor: pointer;
    }


    /* =========================
       CANVAS
    ========================= */

    .canvas-area {

      background: #e6e6eb;

      min-width: 0;

      overflow: hidden;
    }

    #editor {

      width: 100%;

      height: 100%;
    }


    /* =========================
       RIGHT SIDEBAR
    ========================= */

    .right-sidebar {

      background: #17151f;

      border-left: 1px solid #302c3a;

      color: white;

      overflow-y: auto;
    }

    .right-title {

      padding: 15px;

      border-bottom: 1px solid #302c3a;

      font-weight: 800;

      font-size: 14px;
    }

    #traits {

      padding: 10px;
    }

    #styles {

      padding: 10px;
    }


    /* GrapesJS right panel */

    .gjs-sm-sector {

      border-color: #35313f !important;
    }

    .gjs-sm-sector-title {

      background: #211e29 !important;

      color: white !important;
    }

    .gjs-sm-property {

      color: #ddd !important;
    }

    .gjs-field {

      background: #24212d !important;

      border-color: #403b4d !important;

      color: white !important;
    }

    .gjs-field input,
    .gjs-field select {

      color: white !important;
    }

    .gjs-trt-trait {

      color: white !important;
    }


    /* =========================
       MESSAGE
    ========================= */

    #message {

      position: fixed;

      top: 75px;

      left: 50%;

      transform: translateX(-50%);

      background: white;

      color: #111;

      padding: 11px 18px;

      border-radius: 9px;

      box-shadow:
        0 10px 35px rgba(0,0,0,.25);

      z-index: 20000;

      display: none;

      font-weight: 600;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width: 900px) {

      .workspace {

        grid-template-columns:
          180px
          minmax(0, 1fr)
          230px;
      }

      .logo {

        font-size: 15px;
      }

      .top-btn {

        padding: 8px 10px;

        font-size: 12px;
      }

    }


    @media(max-width: 700px) {

      .workspace {

        grid-template-columns:
          145px
          minmax(0, 1fr);
      }

      .right-sidebar {

        display: none;
      }

      .gjs-blocks-c {

        grid-template-columns: 1fr;
      }

      .upload-btn {

        display: none;
      }

    }


    @media(max-width: 500px) {

      .topbar {

        gap: 5px;
      }

      .logo {

        font-size: 13px;
      }

      .preview-btn {

        display: none;
      }

      .logout-btn {

        display: none;
      }

    }

  </style>
</head>


<body>


  <!-- =================================
       TOP BAR
  ================================== -->

  <!-- =================================

    <!-- =================================

    </main>



    <!-- =================================
         RIGHT
    ================================== -->

    <aside class="right-sidebar">


      <div class="right-title">

      <div id="traits"></div>


      <div class="right-title">
        🎨 Style
      </div>

    </aside>


  </div>



  <div id="message"></div>



  <!-- =================================
       SCRIPTS
  ================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Your existing config -->

  <script src="config.js"></script>


  <!-- GrapesJS -->

  <script src="https://unpkg.com/grapesjs@0.22.10/dist/grapes.min.js"></script>



  <script>


    /* =========================================

    ========================================= */

    /* =========================================

    ========================================= */

    function showMessage(text) {

        document.getElementById("message");

      box.textContent = text;

      box.style.display = "block";


      setTimeout(() => {

    /* =========================================

    /* =========================================
       DEFAULT CSS
    ========================================= */

    const defaultCSS = `

      * {

      }

    /* =========================================
       EDITOR
    ========================================= */

    let editor = null;



    async function initEditor() {


      /* ================================
         CHECK LOGIN
      ================================= */

      const {
        data: {
          user
        }
      } =
        await sb.auth.getUser();


      if (!user) {

        location.href =
          "admin.html";

        return;
      }



      /* ================================
         CHECK ADMIN
      ================================= */

      const {
        data: admin,
        error: adminError
      } =
        await sb
          .from("admin_users")
          .select("id")
          .eq("id", user.id)
          .maybeSingle();


      if (
        adminError ||
        !admin
      ) {

        await sb.auth.signOut();

        location.href =
          "admin.html";

        return;
      }



      /* ================================
         LOAD SAVED PAGE
      ================================= */

      let pageHTML =
        defaultHTML;

      let pageCSS =
        defaultCSS;


      const {
        data: savedPage,
        error: loadError
      } =
        await sb
          .from("site_pages")
          .select(
            "html,css"
          )
          .eq(
            "slug",
            "home"
          )
          .maybeSingle();


      if (
        !loadError &&
        savedPage &&
        savedPage.html
      ) {

        pageHTML =
          savedPage.html;

        pageCSS =
          savedPage.css ||
          defaultCSS;
      }



      /* ================================
         CREATE GRAPESJS
      ================================= */

      editor =
        grapesjs.init({

          container:
            "#editor",

          height:
            "100%",

          width:
            "auto",

          fromElement:
            false,

          components:
            pageHTML,

          style:
            pageCSS,

          storageManager:
            false,


          /* BLOCK SIDEBAR */

          blockManager: {

            appendTo:
              "#blocks",

            blocks: [

              /* TEXT */

              {
                id: "text",

                label:
                  "📝<br>Text",

                category:
                  "Basic",

                content:
                  `<p style="padding:10px;">
                    Write your text here
                  </p>`
              },


              /* HEADING */

              {
                id: "heading",

                label:
                  "🔤<br>Heading",

                category:
                  "Basic",

                content:
                  `<h2>
                    New Heading
                  </h2>`
              },


              /* LINK */

              {
                id: "link",

                label:
                  "🔗<br>Link",

                category:
                  "Basic",

                content:
                  `<a href="#">
                    New Link
                  </a>`
              },


              /* BUTTON */

              {
                id: "button",

                label:
                  "🔘<br>Button",

                category:
                  "Basic",

                content:
                  `<a
                    href="#"
                    class="main-button"
                  >
                    New Button
                  </a>`
              },


              /* IMAGE */

              {
                id: "image",

                label:
                  "🖼️<br>Image",

                category:
                  "Basic",

                content:
                  `<img
                    src="https://placehold.co/800x450"
                    alt="Image"
                    style="
                      max-width:100%;
                      height:auto;
                      display:block;
                    "
                  >`
              },


              /* DIVIDER */

              {
                id: "divider",

                label:
                  "➖<br>Divider",

                category:
                  "Basic",

                content:
                  `<hr style="margin:30px 0;">`
              },


              /* SECTION */

              {
                id: "section",

                label:
                  "📦<br>Section",

                category:
                  "Layout",

                content:
                  `
                  <section
                    style="
                      padding:50px 25px;
                    "
                  >

                    <h2>
                      New Section
                    </h2>

                    <p>
                      Section content goes here.
                    </p>

                  </section>
                  `
              },


              /* 2 COLUMNS */

              {
                id: "columns",

                label:
                  "▥<br>2 Columns",

                category:
                  "Layout",

                content:
                  `
                  <div
                    style="
                      display:grid;
                      grid-template-columns:
                        repeat(2,1fr);
                      gap:20px;
                    "
                  >

                    <div
                      style="
                        padding:30px;
                        background:#f5f5f5;
                      "
                    >

                      Column One

                    </div>


                    <div
                      style="
                        padding:30px;
                        background:#f5f5f5;
                      "
                    >

                      Column Two

                    </div>

                  </div>
                  `
              },


              /* SPACER */

              {
                id: "spacer",

                label:
                  "↕<br>Spacer",

                category:
                  "Layout",

                content:
                  `
                  <div
                    style="
                      height:100px;
                    "
                  ></div>
                  `
              },


              /* CARD */

              {
                id: "card",

                label:
                  "🃏<br>Card",

                category:
                  "Layout",

                content:
                  `
                  <div
                    style="
                      background:#fff;
                      padding:30px;
                      border-radius:18px;
                      border:1px solid #eee;
                      margin:15px 0;
                    "
                  >

                    <h2>
                      New Card
                    </h2>

                    <p>
                      Card description
                    </p>

                    <a
                      href="#"
                      class="main-button"
                    >
                      Learn More
                    </a>

                  </div>
                  `
              },


              /* HERO */

              {
                id: "hero",

                label:
                  "⭐<br>Hero",

                category:
                  "Layout",

                content:
                  `
                  <section
                    style="
                      padding:80px 25px;
                      text-align:center;
                      background:#f0edff;
                    "
                  >

                    <h1>
                      Your Hero Title
                    </h1>

                    <p>
                      Your hero description goes here.
                    </p>

                    <a
                      href="#"
                      class="main-button"
                    >
                      Get Started
                    </a>

                  </section>
                  `
              },


              /* FEATURES */

              {
                id: "features",

                label:
                  "✨<br>Features",

                category:
                  "Layout",

                content:
                  `
                  <section
                    style="
                      padding:40px 20px;
                    "
                  >

                    <h2
                      style="
                        text-align:center;
                      "
                    >
                      Our Features
                    </h2>


                    <div
                      style="
                        display:grid;
                        grid-template-columns:
                          repeat(3,1fr);
                        gap:20px;
                      "
                    >

                      <div
                        style="
                          padding:25px;
                          background:white;
                          border:1px solid #eee;
                          border-radius:15px;
                        "
                      >

                        <h3>
                          Feature One
                        </h3>

                        <p>
                          Description
                        </p>

                      </div>


                      <div
                        style="
                          padding:25px;
                          background:white;
                          border:1px solid #eee;
                          border-radius:15px;
                        "
                      >

                        <h3>
                          Feature Two
                        </h3>

                        <p>
                          Description
                        </p>

                      </div>


                      <div
                        style="
                          padding:25px;
                          background:white;
                          border:1px solid #eee;
                          border-radius:15px;
                        "
                      >

                        <h3>
                          Feature Three
                        </h3>

                        <p>
                          Description
                        </p>

                      </div>

                    </div>

                  </section>
                  `
              },


              /* VIDEO */

              {
                id: "video",

                label:
                  "▶️<br>Video",

                category:
                  "Media",

                content:
                  `
                  <video
                    controls
                    style="
                      width:100%;
                      max-width:800px;
                    "
                  >
                  </video>
                  `
              },


              /* ICON */

              {
                id: "icon",

                label:
                  "✦<br>Icon",

                category:
                  "Media",

                content:
                  `
                  <div
                    style="
                      font-size:50px;
                      text-align:center;
                      padding:20px;
                    "
                  >
                    ⭐
                  </div>
                  `
              }

            ]
          },


          /* DEVICE */

          deviceManager: {

            devices: [

              {
                name:
                  "Desktop",

                width:
                  ""
              },

              {
                name:
                  "Tablet",

                width:
                  "768px"
              },

              {
                name:
                  "Mobile",

                width:
                  "375px"
              }

            ]
          },


          /* TRAITS */

          traitManager: {

            appendTo:
              "#traits"
          },


          /* STYLE */

          styleManager: {

            appendTo:
              "#styles",

            sectors: [

              {

                name:
                  "Size",

                open:
                  true,

                properties: [

                  "width",

                  "height",

                  "min-height",

                  "max-width"

                ]
              },


              {

                name:
                  "Spacing",

                open:
                  false,

                properties: [

                  "margin",

                  "padding"

                ]
              },


              {

                name:
                  "Typography",

                open:
                  false,

                properties: [

                  "font-family",

                  "font-size",

                  "font-weight",

                  "color",

                  "text-align",

                  "line-height",

                  "letter-spacing"

                ]
              },


              {

                name:
                  "Background",

                open:
                  false,

                properties: [

                  "background-color",

                  "background-image"

                ]
              },


              {

                name:
                  "Border",

                open:
                  false,

                properties: [

                  "border",

                  "border-radius"

                ]
              }

            ]
          },


          selectorManager: {

            componentFirst:
              true
          },


          panels: {

            defaults: []
          }

        });



      /* =====================================
         AFTER LOAD
      ===================================== */

      editor.on(
        "load",
        () => {

          showMessage(
            "✅ Editor ready"
          );

        }
      );


      /* =====================================
         SELECT
      ===================================== */

      editor.on(
        "component:selected",
        component => {

          if (!component) {
            return;
          }


          const tag =
            component.get(
              "tagName"
            );


          console.log(
            "Selected:",
            tag
          );

        }
      );

    }



    /* =========================================
       IMAGE UPLOAD
    ========================================= */

    const imageInput =
      document.getElementById(
        "imageInput"
      );


    function openImagePicker() {

      imageInput.click();

    }


    document
      .getElementById(
        "uploadTop"
      )
      .addEventListener(
        "click",
        openImagePicker
      );


    document
      .getElementById(
        "uploadSide"
      )
      .addEventListener(
        "click",
        openImagePicker
      );


    imageInput.addEventListener(
      "change",
      event => {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "Please select an image file."
          );

          return;
        }


        const reader =
          new FileReader();


        reader.onload = () => {

          if (!editor) {

            alert(
              "Editor is not ready."
            );

            return;
          }


          const selected =
            editor.getSelected();


          const imageHTML = `

            <img
              src="${reader.result}"
              alt="Uploaded Image"
              style="
                max-width:100%;
                height:auto;
                display:block;
                margin:20px auto;
              "
            >

          `;


          /*
            If a component is selected,
            add image inside it.

            Otherwise add to page.
          */

          if (
            selected &&
            selected.is("wrapper") === false
          ) {

            selected.append(
              imageHTML
            );

          } else {

            editor
              .getWrapper()
              .append(
                imageHTML
              );

          }


          showMessage(
            "📷 Image added"
          );


          imageInput.value = "";

        };


        reader.readAsDataURL(file);

      }
    );



    /* =========================================
       SAVE
    ========================================= */

    document
      .getElementById(
        "saveBtn"
      )
      .addEventListener(
        "click",
        async () => {


          if (!editor) {

            showMessage(
              "Editor not ready"
            );

            return;
          }


          const html =
            editor.getHtml();


          const css =
            editor.getCss();


          const {
            error
          } =
            await sb
              .from("site_pages")
              .upsert(

                {
                  slug:
                    "home",

                  html:
                    html,

                  css:
                    css,

                  updated_at:
                    new Date().toISOString()

                },

                {
                  onConflict:
                    "slug"
                }

              );


          if (error) {

            console.error(
              error
            );

            showMessage(
              "❌ Save failed"
            );

            alert(
              error.message
            );

            return;
          }


          showMessage(
            "✅ Design saved"
          );

        }
      );



    /* =========================================
       PREVIEW
    ========================================= */

    document
      .getElementById(
        "previewBtn"
      )
      .addEventListener(
        "click",
        () => {


          if (!editor) {
            return;
          }


          const html =
            editor.getHtml();


          const css =
            editor.getCss();


          const preview =
            window.open(
              "",
              "_blank"
            );


          preview.document.write(`

            <!DOCTYPE html>

            <html>

            <head>

              <meta
                name="viewport"
                content="
                  width=device-width,
                  initial-scale=1
                "
              >

              <style>

                ${css}

              </style>

            </head>

            <body>

              ${html}

            </body>

            </html>

          `);


          preview.document.close();

        }
      );



    /* =========================================
       LOGOUT
    ========================================= */

    document
      .getElementById(
        "logoutBtn"
      )
      .addEventListener(
        "click",
        async () => {

          await sb.auth.signOut();

          location.href =
            "admin.html";

        }
      );



    /* =========================================
       START
    ========================================= */

    initEditor();


  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Editor</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/grapesjs@0.22.10/dist/css/grapes.min.css"
>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  overflow:hidden;
}

/* TOP BAR */
.topbar{
  height:62px;
  background:#17151f;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
}

.logo{
  font-size:18px;
  font-weight:800;
  margin-right:auto;
}

.top-btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer;
}

.preview{
  background:#fff;
  color:#111;
}

.save{
  background:#6c4df6;
  color:#fff;
}

.photo{
  background:#208f79;
  color:#fff;
}

.logout{
  background:#fff;
  color:#111;
}

/* WORKSPACE */
.workspace{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  bottom:0;
  display:grid;
  grid-template-columns:220px minmax(0,1fr) 270px;
}

/* LEFT */
.leftbar{
  background:#17151f;
  color:#fff;
  overflow-y:auto;
  padding:14px;
  border-right:1px solid #302c3a;
}

.left-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:15px;
}

.category{
  color:#a98cff;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  margin:17px 0 8px;
}

.elements{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.element{
  background:#24212d;
  border:1px solid #3a3545;
  color:#fff;
  border-radius:8px;
  padding:11px 5px;
  font-size:12px;
  cursor:pointer;
  text-align:center;
}

.element:hover{
  background:#342f40;
  border-color:#8065ff;
}

.upload{
  width:100%;
  margin-top:15px;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#6c4df6;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* CANVAS */
.canvas{
  background:#e8e8ed;
  overflow:hidden;
  min-width:0;
}

#editor{
  height:100%;
}

/* RIGHT */
.rightbar{
  background:#17151f;
  color:#fff;
  overflow-y:auto;
  border-left:1px solid #302c3a;
}

.right-title{
  padding:15px;
  font-weight:800;
  border-bottom:1px solid #302c3a;
}

.settings{
  padding:15px;
}

.setting{
  margin-bottom:15px;
}

.setting label{
  display:block;
  font-size:12px;
  color:#aaa;
  margin-bottom:6px;
}

.setting input,
.setting select,
.setting textarea{
  width:100%;
  padding:9px;
  background:#24212d;
  color:#fff;
  border:1px solid #403b4d;
  border-radius:7px;
}

.setting button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:10px;
  background:#6c4df6;
  color:white;
  cursor:pointer;
  font-weight:700;
}

#traits,
#styles{
  padding:10px 15px;
}

/* GRAPES */
.gjs-one-bg{
  background:#17151f;
}

.gjs-two-color{
  color:#ddd;
}

.gjs-three-bg{
  background:#24212d;
}

.gjs-four-color{
  color:#a98cff;
}

.gjs-pn-panels{
  display:none!important;
}

/* MESSAGE */
.message{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:#111;
  padding:11px 18px;
  border-radius:10px;
  box-shadow:0 8px 30px #0005;
  z-index:500;
  display:none;
}

/* MOBILE */
@media(max-width:900px){
  .workspace{
    grid-template-columns:170px minmax(0,1fr);
  }

  .rightbar{
    display:none;
  }

  .top-btn{
    padding:8px 10px;
    font-size:12px;
  }
}

@media(max-width:600px){
  .workspace{
    grid-template-columns:125px minmax(0,1fr);
  }

  .logo{
    font-size:14px;
  }

  .photo{
    display:none;
  }

  .leftbar{
    padding:8px;
  }

  .elements{
    grid-template-columns:1fr;
  }

  .element{
    padding:9px 3px;
  }
}
</style>
</head>

<body>

  <!-- RIGHT SETTINGS -->

    <div class="right-title">

</div>


<div id="message" class="message"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="https://unpkg.com/grapesjs@0.22.10/dist/grapes.min.js"></script>


<script>

const message = document.getElementById("message");


function showMessage(text){

  message.textContent = text;

  message.style.display = "block";

  setTimeout(()=>{
    message.style.display = "none";
  },2500);

}


/* DEFAULT PAGE */

/* PAGE CSS */

const defaultCSS = `

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f7f7fb;
  color:#16161d;
}

.nav{

/* GRAPESJS */

let editor;


async function startEditor(){

  /* ADMIN CHECK */

  const {
    data:{
      user
    }
  } = await sb.auth.getUser();


  if(!user){

    location.href="admin.html";

    return;

  }


  const {
    data:admin
  } = await sb
    .from("admin_users")
    .select("id")
    .eq("id",user.id)
    .maybeSingle();


  if(!admin){

    await sb.auth.signOut();

    location.href="admin.html";

    return;

  }


  /* LOAD SAVED DESIGN */

  let html = defaultHTML;

  let css = defaultCSS;


  const {
    data:saved
  } = await sb
    .from("site_pages")
    .select("html,css")
    .eq("slug","home")
    .maybeSingle();


  if(saved && saved.html){

    html = saved.html;

    css = saved.css || css;

  }


  /* CREATE EDITOR */

  editor = grapesjs.init({

    container:"#editor",

    height:"100%",

    fromElement:false,

    components:html,

    style:css,

    storageManager:false,

    selectorManager:{
      componentFirst:true
    },

    deviceManager:{
      devices:[
        {
          name:"Desktop",
          width:""
        },
        {
          name:"Tablet",
          width:"768px"
        },
        {
          name:"Mobile",
          width:"375px"
        }
      ]
    },

    panels:{
      defaults:[]
    },

    traitManager:{
      appendTo:"#traits"
    },

    styleManager:{
      appendTo:"#styles",

      sectors:[
        {
          name:"Dimension",
          open:true,

          properties:[
            "width",
            "height",
            "min-height",
            "max-width"
          ]
        },

        {
          name:"Spacing",
          open:false,

          properties:[
            "margin",
            "padding"
          ]
        },

        {
          name:"Typography",
          open:false,

          properties:[
            "font-family",
            "font-size",
            "font-weight",
            "color",
            "text-align",
            "line-height"
          ]
        },

        {
          name:"Background",
          open:false,

          properties:[
            "background-color",
            "background-image"
          ]
        },

        {
          name:"Border",
          open:false,

          properties:[
            "border",
            "border-radius"
          ]
        }
      ]

    }

  });


  /* SELECT ELEMENT */

  editor.on(
    "component:selected",
    component => {

      if(!component){

        return;

      }

      showMessage(
        "Selected: "+
        (component.get("tagName") || "element")
      );

    }
  );


  /* ADD ELEMENTS */

  document
    .querySelectorAll(".element")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          addElement(
            button.dataset.type
          );

        }
      );

    });


}


/* ELEMENT LIBRARY */

function addElement(type){

  const components = {

    text:`
      <p>
        Write your text here
      </p>
    `,

    heading:`
      <h2>
        New Heading
      </h2>
    `,

    link:`
      <a href="#">
        New Link
      </a>
    `,

    button:`
      <a class="btn" href="#">
        New Button
      </a>
    `,

    image:`
      <img
        src="https://placehold.co/800x450?text=Your+Image"
        style="max-width:100%;height:auto"
        alt="Image"
      >
    `,

    divider:`
      <hr>
    `,

    section:`
      <section style="padding:50px">
        <h2>New Section</h2>
        <p>Section content goes here.</p>
      </section>
    `,

    columns:`
      <div
        style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:20px;
        "
      >

        <div style="padding:25px">
          Column One
        </div>

        <div style="padding:25px">
          Column Two
        </div>

      </div>
    `,

    spacer:`
      <div style="height:80px"></div>
    `,

    card:`
      <article class="card">

        <h2>
          New Card
        </h2>

        <p>
          Card description
        </p>

        <div class="price">
          ৳0
        </div>

        <a class="btn" href="#">
          Buy Now
        </a>

      </article>
    `,

    hero:`
      <section class="hero">

        <h1>
          Your Hero Title
        </h1>

        <p>
          Your hero subtitle
        </p>

        <a class="btn" href="#">
          Get Started
        </a>

      </section>
    `,

    features:`
      <section style="padding:40px">

        <h2>
          Our Features
        </h2>

        <div
          style="
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:15px;
          "
        >

          <div class="card">
            <h3>Feature One</h3>
            <p>Description</p>
          </div>

          <div class="card">
            <h3>Feature Two</h3>
            <p>Description</p>
          </div>

          <div class="card">
            <h3>Feature Three</h3>
            <p>Description</p>
          </div>

        </div>

      </section>
    `,

    video:`
      <video
        controls
        style="max-width:100%"
      >
      </video>
    `,

    icon:`
      <div style="font-size:50px">
        ⭐
      </div>
    `

  };


  editor.addComponents(
    components[type] || components.text
  );

}


/* IMAGE UPLOAD */

const fileInput =
  document.getElementById("imageInput");


document
  .getElementById("uploadBtn")
  .onclick = ()=>{
    fileInput.click();
  };


document
  .getElementById("photoBtn")
  .onclick = ()=>{
    fileInput.click();
  };


fileInput.addEventListener(
  "change",
  event=>{

    const file =
      event.target.files[0];

    if(!file){

      return;

    }


    if(!file.type.startsWith("image/")){

      alert("Please select an image.");

      return;

    }


    const reader =
      new FileReader();


    reader.onload = function(){

      const img =
        editor.addComponents(`

          <img
            src="${reader.result}"
            alt="Uploaded Image"
            style="
              max-width:100%;
              height:auto;
              display:block;
              margin:20px auto;
            "
          >

      `);


      showMessage(
        "Photo added successfully"
      );

    };


    reader.readAsDataURL(file);

    event.target.value="";

  });


/* SAVE */

document
  .getElementById("saveBtn")
  .onclick = async ()=>{

    if(!editor){

      return;

    }


    const html =
      editor.getHtml();


    const css =
      editor.getCss();


    const {
      error
    } = await sb
      .from("site_pages")
      .upsert(
        {
          slug:"home",
          html:html,
          css:css
        },
        {
          onConflict:"slug"
        }
      );


    if(error){

      console.error(error);

      showMessage(
        "Save failed: "+
        error.message
      );

      return;

    }


    showMessage(
      "✅ Design saved successfully"
    );

  };


/* PREVIEW */

document
  .getElementById("previewBtn")
  .onclick = ()=>{

    if(!editor){

      return;

    }


    const html =
      editor.getHtml();

    const css =
      editor.getCss();


    const win =
      window.open(
        "",
        "_blank"
      );


    win.document.write(`

      <!DOCTYPE html>

      <html>

      <head>

        <meta name="viewport"
          content="width=device-width,initial-scale=1">

        <style>
          ${css}
        </style>

      </head>

      <body>

        ${html}

      </body>

      </html>

    `);

    win.document.close();

  };


/* LOGOUT */

document
  .getElementById("logoutBtn")
  .onclick = async ()=>{

    await sb.auth.signOut();

    location.href="admin.html";

  };


/* START */

startEditor();

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Editor</title>
<link href="https://unpkg.com/grapesjs@0.22.10/dist/css/grapes.min.css" rel="stylesheet">
<style>
html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#111;color:#fff}
.top{height:62px;background:#17151f;display:flex;align-items:center;gap:12px;padding:0 14px;position:fixed;left:0;right:0;top:0;z-index:20}
.top h2{font-size:18px;margin:0 auto 0 0}.top button{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}
#save{background:#6c4df6;color:white}#uploadTop{background:#2b8a78;color:white}#preview{background:white;color:#111}.msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:10px;background:#fff;color:#111;display:none;box-shadow:0 8px 30px #0004}
#editor{margin-top:62px;height:calc(100vh - 62px)}
.gjs-one-bg{background:#17151f}.gjs-two-color{color:#ddd}.gjs-three-bg{background:#24212d}.gjs-four-color,.gjs-four-color-h:hover{color:#a88cff}
.uploadBox{padding:12px}.uploadBox button{width:100%;padding:10px;border:0;border-radius:8px;background:#6c4df6;color:white;font-weight:700;cursor:pointer}.uploadBox small{display:block;color:#aaa;margin-top:7px;line-height:1.4}
</style>
</head>
<body>
<div class="top"><h2>🎨 Visual Editor</h2><button id="uploadTop">📷 Add Photo</button><button id="preview">Preview</button><button id="save">Save Changes</button><button id="logout">Logout</button></div>
<div id="msg" class="msg"></div><div id="editor"></div>
<input id="fileInput" type="file" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/grapesjs@0.22.10/dist/grapes.min.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const msg=document.getElementById('msg');
function toast(t){msg.textContent=t;msg.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>msg.style.display='none',2600)}
let editor;

const defaultHtml=`<nav class="nav"><a class="logo" href="index.html">Canva Account Store</a><div class="navlinks"><a href="#products">Products</a><a href="order-status.html">Order Status</a><a class="btn" href="order.html">Buy Now</a></div></nav>
<section class="hero"><h1>Choose Your Canva Account</h1><p>Simple ordering for Canva Pro and Owner accounts.</p></section>
<main class="container" id="products"><div id="productsGrid" class="cards">
<article class="card"><h2>Canva Pro Account</h2><p>Premium Canva account.</p><div class="price">৳500</div><ul class="features"><li>Premium features</li><li>Easy ordering</li><li>Fast delivery</li></ul><a class="btn" href="order.html?product=canva-pro">Buy Now</a></article>
<article class="card"><h2>Canva Owner Account</h2><p>Canva owner account.</p><div class="price">৳1500</div><ul class="features"><li>Owner access</li><li>Easy ordering</li><li>Fast delivery</li></ul><a class="btn" href="order.html?product=canva-owner">Buy Now</a></article>
</div></main>`;

const defaultCss=`
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f7fb;color:#16161d;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 6%;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:20px;white-space:nowrap}
.navlinks{display:flex;gap:20px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:12px 18px;background:#6c4df6;color:#fff;font-weight:700;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.secondary{background:#eee;color:#222}
.container{width:min(1100px,100%);margin:auto;padding:50px 20px}
.hero{text-align:center;padding:70px 20px 55px}
.hero h1{font-size:clamp(34px,6vw,48px);line-height:1.1;margin:0 0 14px}
.hero p{color:#666;font-size:clamp(16px,2.5vw,18px);margin:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:#fff;border:1px solid #e8e8ef;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000008;min-width:0}
.price{font-size:32px;font-weight:800;margin:18px 0}
.features{padding-left:20px;line-height:2}
.form{width:min(650px,100%);margin:auto;background:#fff;padding:clamp(20px,5vw,30px);border-radius:18px;border:1px solid #eee}
.form h1{font-size:clamp(30px,6vw,44px);line-height:1.15;margin-top:0}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;max-width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;min-height:46px;background:#fff}
.field textarea{min-height:100px;resize:vertical}
.notice{padding:15px;border-radius:10px;background:#f0edff;margin-bottom:18px;overflow-wrap:anywhere}
.success{text-align:center}
.hidden{display:none}
.admin{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:#17151f;color:#fff;padding:25px;min-width:0}
.side a{display:block;padding:12px;border-radius:8px;margin:5px 0}
.side a:hover{background:#302b3c}
.main{padding:30px;min-width:0;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.stat{background:#fff;padding:20px;border-radius:14px;border:1px solid #eee;min-width:0}
.tablewrap{background:#fff;border-radius:14px;margin-top:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{width:100%;min-width:900px;border-collapse:collapse}
.table th,.table td{padding:13px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
.badge{padding:5px 9px;border-radius:99px;background:#eee;font-size:12px}
.actions{display:flex;gap:7px}
@media(max-width:800px){
.nav{padding:14px 18px}.navlinks{gap:10px}.navlinks a:not(.btn){display:none}
.container{padding:32px 14px}.hero{padding:50px 18px 35px}.cards{grid-template-columns:1fr}.card{padding:22px}
.admin{display:block}.side{padding:16px;display:flex;align-items:center;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:20}
.side h2{font-size:18px;margin:0 12px 0 0}.side a{white-space:nowrap;margin:0;padding:9px 11px}.side .btn{margin-left:auto;white-space:nowrap}
.main{padding:20px 14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
.nav{padding:12px 14px}.logo{font-size:17px}.nav>a:last-child{font-size:14px}
.container{padding:24px 10px}.hero h1{font-size:32px}.hero p{line-height:1.5}.form{padding:18px 14px;border-radius:14px}.form h1{font-size:30px}
.card{padding:18px;border-radius:14px}.price{font-size:28px}.btn{width:100%}.nav .btn{width:auto;padding:10px 13px}
.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat h2{font-size:24px}.side{gap:5px}.side .btn{width:auto}
}
@media(max-width:360px){.logo{font-size:15px}.nav>a:last-child{font-size:13px}.hero h1{font-size:28px}.stats{grid-template-columns:1fr}}
`;

async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.href='admin.html';return}
 const {data:adm}=await sb.from('admin_users').select('id').eq('id',user.id).maybeSingle();
 if(!adm){await sb.auth.signOut();location.href='admin.html';return}

 let html=defaultHtml, css=defaultCss;
 const {data,error}=await sb.from('site_pages').select('html,css').eq('slug','home').maybeSingle();
 if(!error && data && data.html){html=data.html;css=data.css||css;}

 editor=grapesjs.init({
   container:'#editor', height:'100%', fromElement:false,
   components:html, style:css,
   storageManager:false,
   blockManager:{appendTo:'#blocks'},
   panels:{defaults:[
   {id:'basic-actions',buttons:[
     {id:'visibility',active:true,className:'fa fa-eye',command:'sw-visibility',attributes:{title:'View Components'}},
     {id:'fullscreen',className:'fa fa-arrows-alt',command:'fullscreen',attributes:{title:'Fullscreen'}},
     {id:'export',className:'fa fa-code',command:'export-template',attributes:{title:'View Code'}},
     {id:'undo',className:'fa fa-undo',command:'core:undo',attributes:{title:'Undo'}},
     {id:'redo',className:'fa fa-repeat',command:'core:redo',attributes:{title:'Redo'}}
   ]}
 ]},
   deviceManager:{devices:[
      {name:'Desktop',width:''},{name:'Tablet',width:'768px',widthMedia:'992px'},
      {name:'Mobile',width:'375px',widthMedia:'480px'}
   ]},
   selectorManager:{componentFirst:true},
   assetManager:{
     upload:false,
     assets:[]
   },
   styleManager:{sectors:[
     {name:'Dimension',open:true,buildProps:['width','height','max-width','min-height','margin','padding']},
     {name:'Typography',open:true,buildProps:['font-family','font-size','font-weight','color','line-height','letter-spacing','text-align']},
     {name:'Decorations',open:true,buildProps:['background-color','border-radius','border','box-shadow']},
     {name:'Extra',buildProps:['opacity','display','position','top','right','bottom','left']}
   ]},
   blockManager:{blocks:[
     {id:'text',label:'Text',category:'Basic',content:'<p>Write your text here</p>'},
     {id:'heading',label:'Heading',category:'Basic',content:'<h2>New Heading</h2>'},
     {id:'image',label:'Image',category:'Basic',content:'<img src="https://placehold.co/800x450?text=Your+Image" alt="Image">'},
     {id:'button',label:'Button',category:'Basic',content:'<a class="btn" href="#">Button</a>'},
     {id:'section',label:'Section',category:'Layout',content:'<section style="padding:40px"><h2>New Section</h2><p>Section content</p></section>'},
     {id:'columns',label:'2 Columns',category:'Layout',content:'<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px"><div style="padding:20px">Column 1</div><div style="padding:20px">Column 2</div></div>'},
     {id:'divider',label:'Divider',category:'Basic',content:'<hr>'},
     {id:'spacer',label:'Spacer',category:'Basic',content:'<div style="height:40px"></div>'}
   ]}
 });

 // Add upload controls to the Asset Manager area
 const am=editor.AssetManager;
 const uploadPanel=document.createElement('div');
 uploadPanel.className='uploadBox';
 uploadPanel.innerHTML='<button type="button" id="uploadImageBtn">📁 Upload Image</button><small>Upload from your computer. Images are stored in Supabase.</small>';
 document.querySelector('.gjs-am-assets-cont')?.prepend(uploadPanel);
 document.getElementById('uploadImageBtn')?.addEventListener('click',()=>document.getElementById('fileInput').click());

 editor.on('asset:add',asset=>{});
 document.getElementById('uploadTop').addEventListener('click',()=>document.getElementById('fileInput').click());
 document.getElementById('fileInput').addEventListener('change',async e=>{
   const file=e.target.files[0]; if(!file)return;
   if(!file.type.startsWith('image/')){toast('Please select an image file');return}
   toast('Uploading image...');
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
   const path='editor/'+crypto.randomUUID()+'.'+ext;
   const {error}=await sb.storage.from('site-images').upload(path,file,{contentType:file.type,upsert:false});
   if(error){toast('Upload failed: '+error.message);e.target.value='';return}
   const {data}=sb.storage.from('site-images').getPublicUrl(path);
   editor.AssetManager.add({src:data.publicUrl,name:file.name,type:'image'});
   const selected=editor.getSelected();
   if(selected && selected.get('type')==='image') {
     selected.set('src',data.publicUrl);
   } else {
     editor.addComponents({type:'image',src:data.publicUrl,style:{'max-width':'100%','height':'auto'}});
   }
   toast('Image added to page');
   e.target.value='';
 });

 document.getElementById('save').onclick=async()=>{
   const html=editor.getHtml(), css=editor.getCss();
   const {error}=await sb.from('site_pages').upsert({slug:'home',html,css,updated_at:new Date().toISOString()},{onConflict:'slug'});
   if(error){toast('Save failed: '+error.message);return}
   toast('Saved! Public homepage updated.');
 };
 document.getElementById('preview').onclick=()=>{
   const html=editor.getHtml(),css=editor.getCss();
   const w=window.open('','_blank');
   w.document.write('<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+css+'</style></head><body>'+html+'</body></html>');
   w.document.close();
 };
 document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};
}
boot();
</script>
</body></html>
